# Same as application.properties, but the CADD SNV tabix is the cohort subset built by
# embedpvp2/code/eval/build_cadd_subset.sh instead of the 87 GB whole-genome file.
#
# The subset holds every position any spiked VCF in the cohort contains (the shared GIAB
# HG001 background plus every case's causal variant), so no lookup Exomiser can make is
# missing from it. Scores are copied verbatim from the whole-genome file, so any run using
# this must produce byte-identical CADD values — that is checked, not assumed.
#
# Use this for the unfiltered arm, where each case issues ~93k CADD lookups.
exomiser.data-directory=/home/zhapacfp/Git/vexomiser/exomiser-data

exomiser.hg38.data-version=2406

exomiser.phenotype.data-version=2406

logging.level.com.zaxxer.hikari=ERROR
logging.level.org.monarchinitiative.exomiser=WARN
exomiser.hg38.cadd-snv-path=${exomiser.data-directory}/cadd/1.7/cadd_cohort_subset.tsv.gz
exomiser.hg38.cadd-in-del-path=${exomiser.data-directory}/cadd/1.7/InDels.tsv.gz
